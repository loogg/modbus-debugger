name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: npm ci
      - name: Install simulator dependencies
        run: python -m pip install -r tools/simulator/requirements.txt
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        env:
          APPDATA: ${{ github.workspace }}\out\test-temp\ci-profile\Roaming
          LOCALAPPDATA: ${{ github.workspace }}\out\test-temp\ci-profile\Local
          MODBUS_DATA_DIR: ${{ github.workspace }}\out\test-temp\ci-data
          MODBUS_RTU_MASTER_PORT: ''
          MODBUS_RTU_SLAVE_PORT: ''
        run: |
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA, $env:MODBUS_DATA_DIR | Out-Null
          npm test -- tests/unit tests/integration
